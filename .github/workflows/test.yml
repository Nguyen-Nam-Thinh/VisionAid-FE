name: Test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    # Playwright uses the installed Microsoft Edge (channel msedge), which windows-latest ships with.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Mock-mode E2E only; the API suite needs a live backend and test accounts.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
